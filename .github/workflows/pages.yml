# Test, build and publish the site on GitHub Pages on every push to main.
# When the site moves to its own domain, set the repository variable SITE_URL
# (Settings → Secrets and variables → Actions → Variables), e.g. https://railgaddi.in
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # a project site lives under /<repo>/; a custom domain serves from the root
      BASE_PATH: ${{ vars.SITE_URL && '/' || '/railgaddi/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://nimb-ou.github.io/railgaddi' }}
      SPA_404: "1" # GitHub Pages has no SPA fallback: 404.html is the app shell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: data/ is built from db/
        run: python3 pipeline/build_network.py --check
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
