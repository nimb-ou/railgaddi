# Once a month: ask Wikipedia again for running days and newer trains, rebuild data/, and open a
# pull request if anything changed. Nothing goes live until someone reviews and merges it.
name: Refresh timetable data

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wikipedia: running days and newer trains
        run: python3 pipeline/import_wikipedia.py raw --refresh
      - name: Rebuild data/ (validates every row)
        run: python3 pipeline/build_network.py
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm test
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: data/refresh
          commit-message: "Data: monthly refresh from Wikipedia"
          title: "Monthly timetable data refresh"
          body: |
            Running days and newer trains re-read from Wikipedia by `pipeline/import_wikipedia.py`.
            Check the diff of `db/trains.csv` and `db/newer_trains.csv` before merging; tests passed.
          labels: data
          delete-branch: true
