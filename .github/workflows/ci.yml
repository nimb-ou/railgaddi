# Type-check, test and build every pull request (and every push that isn't main's deploy).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: data/ is built from db/
        run: python3 pipeline/build_network.py --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
